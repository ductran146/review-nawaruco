# Ping Supabase định kỳ để gói Free không bị tự pause (7 ngày không hoạt động).
# Cài đặt: copy file này vào repo GitHub tại .github/workflows/supabase-keepalive.yml
# rồi thêm 2 secret (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       = https://xxxxx.supabase.co
#   SUPABASE_ANON_KEY  = anon/public key (KHÔNG dùng service_role)
name: supabase-keepalive

on:
  schedule:
    - cron: '17 3 */3 * *'   # 03:17 UTC, mỗi 3 ngày
  workflow_dispatch: {}       # cho phép bấm chạy tay

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            "$URL/rest/v1/project_members?select=project_id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"; head -c 300 /tmp/out.json; echo
          # 200 = OK (RLS có thể trả []). Các mã khác = lỗi/đang pause.
          [ "$code" = "200" ]
