<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ tổ chức minh họa</title>
  <desc id="desc">Dữ liệu demo gồm Hội đồng thành viên, Ban Giám đốc và bốn đơn vị chức năng.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#eaf6fc"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00649f"/>
      <stop offset="1" stop-color="#0086c8"/>
    </linearGradient>
    <linearGradient id="director" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#007a28"/>
      <stop offset="1" stop-color="#00ab38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#003a5c" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1500" cy="80" r="230" fill="#cbe6f6" opacity=".55"/>
  <circle cx="80" cy="850" r="260" fill="#def7e6" opacity=".52"/>

  <text x="100" y="100" fill="#0e1b26" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="700">SƠ ĐỒ TỔ CHỨC</text>
  <text x="100" y="145" fill="#51697a" font-family="Inter, Arial, sans-serif" font-size="23">Mô hình cơ cấu tham khảo cho doanh nghiệp cấp nước</text>
  <g transform="translate(1260 74)">
    <rect width="240" height="54" rx="27" fill="#fff" stroke="#cbe6f6" stroke-width="2"/>
    <circle cx="29" cy="27" r="8" fill="#00ab38"/>
    <text x="50" y="35" fill="#005080" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Dữ liệu minh họa</text>
  </g>

  <path d="M800 328V390 M800 390V443 M257 443H1343 M257 443V510 M619 443V510 M981 443V510 M1343 443V510" fill="none" stroke="#8fbfd9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="390" r="10" fill="#00649f"/>

  <g filter="url(#shadow)">
    <rect x="560" y="190" width="480" height="138" rx="24" fill="url(#top)"/>
    <circle cx="625" cy="259" r="34" fill="#fff" opacity=".18"/>
    <path d="M613 263l10 10 18-27" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="800" y="272" text-anchor="middle" fill="#fff" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="700">HỘI ĐỒNG THÀNH VIÊN</text>

    <rect x="590" y="365" width="420" height="108" rx="22" fill="url(#director)"/>
    <text x="800" y="430" text-anchor="middle" fill="#fff" font-family="Montserrat, Arial, sans-serif" font-size="32" font-weight="700">BAN GIÁM ĐỐC</text>

    <g fill="#fff" stroke="#cbe6f6" stroke-width="3">
      <rect x="95" y="510" width="324" height="196" rx="24"/>
      <rect x="457" y="510" width="324" height="196" rx="24"/>
      <rect x="819" y="510" width="324" height="196" rx="24"/>
      <rect x="1181" y="510" width="324" height="196" rx="24"/>
    </g>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" font-size="27" font-weight="700" fill="#003a5c" text-anchor="middle">
    <text x="257" y="586"><tspan x="257">PHÒNG</tspan><tspan x="257" dy="38">HÀNH CHÍNH – NHÂN SỰ</tspan></text>
    <text x="619" y="586"><tspan x="619">PHÒNG</tspan><tspan x="619" dy="38">TÀI CHÍNH – KẾ TOÁN</tspan></text>
    <text x="981" y="586"><tspan x="981">PHÒNG</tspan><tspan x="981" dy="38">KỸ THUẬT – VẬN HÀNH</tspan></text>
    <text x="1343" y="586"><tspan x="1343">PHÒNG</tspan><tspan x="1343" dy="38">KINH DOANH – DỊCH VỤ</tspan></text>
  </g>
  <g fill="#00ab38">
    <rect x="191" y="674" width="132" height="7" rx="4"/>
    <rect x="553" y="674" width="132" height="7" rx="4"/>
    <rect x="915" y="674" width="132" height="7" rx="4"/>
    <rect x="1277" y="674" width="132" height="7" rx="4"/>
  </g>

  <rect x="100" y="770" width="1400" height="1" fill="#cbd8e0"/>
  <text x="800" y="822" text-anchor="middle" fill="#51697a" font-family="Inter, Arial, sans-serif" font-size="21">Lưu ý: Tên đơn vị và cơ cấu trong sơ đồ chỉ dùng để trình bày giao diện demo.</text>
</svg>
